name = "photo-voting-api"
main = "worker/index.ts"
compatibility_date = "2024-10-22"
[vars]
MAX_PHOTOS_PER_ROOM = "200"
MAX_PHOTO_BYTES = "5242880"
MAX_ROOM_BYTES = "1073741824"
[[d1_databases]]
binding = "DB"
database_name = "photo-voting"
database_id = "d3250ca7-40dd-46ae-a3fd-e5f3aaeb3061"
[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "photo-voting-private"
[[unsafe.bindings]]
name = "ROOM_CREATION_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 5, period = 60 }
[triggers]
crons = ["0 * * * *"]

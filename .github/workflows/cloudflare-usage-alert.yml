name: Cloudflare usage alert

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: cloudflare-usage-alert
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cloudflare 使用量を取得
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/cloudflare-usage-alert.mjs > cloudflare-usage.json
      - name: 閾値到達時に Issue を作成
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/create-cloudflare-alert-issues.mjs cloudflare-usage.json
      - name: 使用量レポートを保存
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-usage-${{ github.run_id }}
          path: cloudflare-usage.json
          retention-days: 7
